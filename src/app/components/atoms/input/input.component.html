<input 
    [type]="type" 
    [attr.id]="inputId"
    [attr.step]="step"
    [placeholder]="placeholder" 
    [value]="value ?? ''"
    [disabled]="disabled"
    class="form-control"
    [class.form-control-sm]="size === 'sm'"
    [class.is-invalid]="invalid" 
    (input)="onInputChange($event)"
    (blur)="onTouched()" />
