<div
  class="row g-3"
  *ngIf="players.length > 0"
>
  <div
    class="col-12 col-md-6"
    *ngFor="
      let player of (
        players
        | filterPlayers: searchText : position
        | sortPlayers: sortBy
      );
      trackBy: trackById
    "
  >
    <app-player-card
  [player]="player"
  [selected]="selectedId === player.id"
  (cardClick)="select($event)"
  (deleteClick)="playerDeleted.emit($event)"
  >
  </app-player-card>
  </div>
</div>

<div *ngIf="players.length === 0">
  No hay jugadores disponibles.
</div>
